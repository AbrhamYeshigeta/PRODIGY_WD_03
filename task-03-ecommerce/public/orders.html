<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Orders · Prodigy Store</title>
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/storefront.css" />
</head>
<body>

  <div class="announce">
    🚚 Free delivery on orders over 500 ETB · Same-day in Addis Ababa
  </div>

  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="site-logo">
        <span class="site-logo-mark">🥬</span>
        <span class="site-logo-text">Prodigy Store</span>
      </a>

      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/">Shop All</a>
        <a href="/cart.html">Cart</a>
      </nav>

      <div class="site-actions">
        <a href="/cart.html" class="cart-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span>Cart</span>
          <span class="cart-count" id="cart-count">0</span>
        </a>

        <div class="user-menu-wrap">
          <div class="user-menu" id="user-menu">
            <span class="user-menu-name" id="user-name">Sign in</span>
            <span class="user-menu-avatar" id="user-avatar">?</span>
          </div>

          <div class="user-dropdown hidden" id="user-dropdown">
            <div class="user-dropdown-header">
              <div class="user-dropdown-avatar" id="dropdown-avatar">?</div>
              <div class="user-dropdown-info">
                <div class="user-dropdown-name" id="dropdown-name">User</div>
                <div class="user-dropdown-email" id="dropdown-email">user@example.com</div>
              </div>
            </div>
            <div class="user-dropdown-divider"></div>
            <a href="/orders.html" class="user-dropdown-item">My Orders</a>
            <a href="/cart.html" class="user-dropdown-item">My Cart</a>
            <div class="user-dropdown-divider"></div>
            <button type="button" class="user-dropdown-item user-dropdown-logout" id="logout-btn">Log Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="store-main">
    <div class="orders-page-head">
      <h1 class="orders-page-title">My Orders</h1>
      <span class="orders-page-count" id="orders-count">Loading…</span>
    </div>

    <div id="orders-container"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>© 2025 Prodigy Store · Prodigy InfoTech Task-03</p>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module" src="/js/shop/orders.js"></script>
</body>
</html>
