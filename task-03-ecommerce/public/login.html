<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in · Prodigy Store</title>
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="/" class="auth-brand">
       <img src="/img/logo.png" alt="Prodigy Store logo" class="auth-logo-img" />
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to continue shopping.</p>

      <!-- ERROR BOX -->
      <div id="errorBox" style="display:none; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; padding:12px; border-radius:8px; font-size:13px; margin-bottom:20px; text-align:center;"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="pw-field">
            <label for="password">Password</label>
            <div class="pw-wrap" id="pw-wrap">
              <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password" />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
              </button>
            </div>
        </div>

        <button type="submit" class="btn btn-green btn-full" id="submitBtn">
          Sign in
        </button>
      </form>

      <p class="auth-footer">
        New to Prodigy Store? <a href="/register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // 🚨 THIS STOPS THE GET REQUEST 🚨

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      errorBox.style.display = 'none';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'include'
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Invalid email or password');
        }

        // Success! Redirect based on role
        const role = data.user ? data.user.role : (data.data && data.data.user ? data.data.user.role : 'customer');
        
        if (role === 'seller') window.location.href = '/seller/dashboard.html';
        else if (role === 'admin') window.location.href = '/admin/index.html';
        else window.location.href = '/';

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    // Password Toggle
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
