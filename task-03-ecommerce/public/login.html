<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Prodigy Store</title>
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="/" class="auth-brand">
       <img src="/img/logo.png" alt="Prodigy Store logo" class="auth-logo-img" />
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to continue shopping.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required
                 placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="pw-field">
            <label for="password">Password</label>

            <div class="pw-wrap" id="pw-wrap">
              <input type="password" id="password" name="password" required
                    placeholder="Your password" autocomplete="current-password" />

              <button type="button" class="pw-toggle" id="pw-toggle"
                      aria-label="Show password" title="Show password">
                <svg class="icon-show" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-hide" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
        </div>

        <button type="submit" class="btn btn-green btn-full" id="submit-btn">
          Sign in
        </button>
      </form>

      <p id="msg" class="msg" role="status"></p>

      <p class="auth-footer">
        New to Prodigy Store?
        <a href="/register.html">Create an account</a>
      </p>
    </div>
  </main>

  <script type="module" src="/js/auth/login.js"></script>
</body>
</html>
