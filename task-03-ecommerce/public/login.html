<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Prodigy Store</title>
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="/" class="auth-brand">
       <img src="/img/logo.png" alt="Prodigy Store logo" class="auth-logo-img" />
      </a>

      <!-- Added IDs here so JS can change the text -->
      <h1 class="auth-title" id="page-title">Welcome back</h1>
      <p class="auth-sub" id="page-subtitle">Sign in to continue shopping.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required
                 placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="pw-field">
            <label for="password">Password</label>

            <div class="pw-wrap" id="pw-wrap">
              <input type="password" id="password" name="password" required
                    placeholder="Your password" autocomplete="current-password" />

              <button type="button" class="pw-toggle" id="pw-toggle"
                      aria-label="Show password" title="Show password">
                <svg class="icon-show" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-hide" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
        </div>

        <button type="submit" class="btn btn-green btn-full" id="submit-btn">
          Sign in
        </button>
      </form>

      <p id="msg" class="msg" role="status"></p>

      <p class="auth-footer">
        New to Prodigy Store?
        <!-- Added ID to change link dynamically -->
        <a href="/register.html" id="register-link">Create an account</a>
      </p>
    </div>
  </main>

  <!-- Replaced the src script with an inline module so you have the full logic -->
  <script type="module">
    import { api } from '/js/api.js';

    // 1. Check URL for redirect parameter
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    // 2. Change UI text if it's a merchant
    if (redirectUrl && redirectUrl.includes('seller')) {
      document.title = "Merchant Portal · Prodigy Store";
      document.getElementById('page-title').textContent = "Merchant Portal";
      document.getElementById('page-subtitle').textContent = "Sign in to manage your shop or continue your application.";
    }

    // 3. Pass the redirect parameter to the Register link
    const registerLink = document.getElementById('register-link');
    if (registerLink && redirectUrl) {
      registerLink.href = `/register.html?redirect=${redirectUrl}`;
    }

    // 4. Handle Form Submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('msg');
      
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      msg.textContent = '';

      try {
        const res = await api.post('/auth/login', { email, password });
        
        // SMART REDIRECT
        if (redirectUrl) {
          window.location.href = redirectUrl; // Send to /seller/apply.html
        } else {
          // Normal role-based redirect
          if (res.data.user.role === 'seller') window.location.href = '/seller/dashboard.html';
          else if (res.data.user.role === 'admin') window.location.href = '/admin/index.html';
          else window.location.href = '/';
        }
      } catch (err) {
        msg.textContent = 'Invalid email or password';
        msg.style.color = 'red';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    // Existing UI Logic for Password Toggle
    const pwToggle = document.getElementById('pw-toggle');
    const pwInput = document.getElementById('password');
    if (pwToggle && pwInput) {
      pwToggle.addEventListener('click', () => {
        const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwInput.setAttribute('type', type);
        pwToggle.classList.toggle('show');
      });
    }
  </script>
</body>
</html>
