<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · Prodigy Store</title>
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .field-error { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
    .input-error { border-color: #dc2626 !important; }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="/" class="auth-brand">
         <img src="/img/logo.png" alt="Prodigy Store logo" class="auth-logo-img" />
      </a>

      <h1 class="auth-title" id="page-title">Create your account</h1>
      <p class="auth-sub" id="page-subtitle">Join us and start shopping fresh house vegetables.</p>

      <form id="register-form" class="auth-form" novalidate>
        <div>
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" required
         placeholder="e.g. Sara Bekele" autocomplete="name" />
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required
                 minlength="3" maxlength="30" placeholder="pick a username"
                 autocomplete="username" />
          <!-- NEW: Inline error message for username -->
          <p class="field-error" id="username-error">This username is already taken. Please try another.</p>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required
                 placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="pw-field">
          <label for="password">Password</label>
          <div class="pw-wrap" id="pw-wrap">
              <input type="password" id="password" name="password" required
                  placeholder="Create a strong password"
                  autocomplete="new-password" />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
                <svg class="icon-show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                    <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
          </div>
        </div>

        <button type="submit" class="btn btn-green btn-full" id="submit-btn">
          Create account
        </button>
      </form>

      <p id="msg" class="msg" role="status"></p>

      <p class="auth-footer">
        Already have an account?
        <a href="/login.html" id="login-link">Sign in</a>
      </p>
    </div>
  </main>

  <script>
    // 1. Check URL for redirect parameter (Merchant flow)
    const urlParams = new URLSearchParams(window.location.search);
    const requestedRedirect = urlParams.get('redirect');
    const safeReturnTo = (candidate) => {
      if (!candidate || !candidate.startsWith('/') || candidate.startsWith('//') || candidate.includes('\\')) {
        return null;
      }

      const url = new URL(candidate, window.location.origin);
      return url.origin === window.location.origin
        && !/^\/(seller|admin)(\/|$)/.test(url.pathname)
        ? `${url.pathname}${url.search}${url.hash}`
        : null;
    };
    const redirectUrl = safeReturnTo(requestedRedirect);

    const loginLink = document.getElementById('login-link');
    if (loginLink && redirectUrl) {
      loginLink.href = `/login.html?${new URLSearchParams({ redirect: redirectUrl })}`;
    }

    // 2. Handle Form Submission
     document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  // Grab the values safely
  const name = document.getElementById('full-name').value;
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  
  btn.disabled = true;
  btn.textContent = 'Creating account...';
  msg.textContent = '';

  try {
    const response = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, username, email, password }) 
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || 'Registration failed');
    }

    await fetch('/api/auth/customer-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
      credentials: 'include'
    }).then(async (loginResponse) => {
      const loginData = await loginResponse.json();
      if (!loginResponse.ok) {
        throw new Error(loginData.message || 'Account created, but sign-in failed');
      }
    });

    window.location.href = redirectUrl || '/';

  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = 'red';
    btn.disabled = false;
    btn.textContent = 'Create account';
  }
});

    // 3. Password Toggle UI
    const pwToggle = document.getElementById('pw-toggle');
    const pwInput = document.getElementById('password');
    if (pwToggle && pwInput) {
      pwToggle.addEventListener('click', () => {
        const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwInput.setAttribute('type', type);
        
        // Toggle icons
        const showIcon = pwToggle.querySelector('.icon-show');
        const hideIcon = pwToggle.querySelector('.icon-hide');
        if (type === 'text') {
          showIcon.style.display = 'none';
          hideIcon.style.display = 'block';
        } else {
          showIcon.style.display = 'block';
          hideIcon.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
