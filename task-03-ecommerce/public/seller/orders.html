<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Orders · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'orders' });

  /* ── Demo data (later: GET /api/sellers/me/orders) ── */
  const orders = [
    {
      id: 'ORD-042', status: 'pending', method: 'Chapa',
      time: '2 minutes ago', unread: true,
      product: { name: 'Red Potatoes 2kg', img: '🥔', qty: 2, unit: 'qtl', unitPrice: 8500 },
      buyer: { name: 'Sara Bekele', phone: '+251911223344', address: 'Bole Road, Bldg 12, Addis Ababa' },
    },
    {
      id: 'ORD-041', status: 'paid', method: 'Chapa',
      time: '18 minutes ago', unread: true,
      product: { name: 'Red Onions 1kg', img: '🧅', qty: 1, unit: 'qtl', unitPrice: 5500 },
      buyer: { name: 'Abebe Tesfaye', phone: '+251911234567', address: 'Megenagna, Addis Ababa' },
    },
    {
      id: 'ORD-040', status: 'shipped', method: 'Chapa',
      time: '2 hours ago', unread: false,
      product: { name: 'Fresh Carrots 1kg', img: '🥕', qty: 3, unit: 'qtl', unitPrice: 4000 },
      buyer: { name: 'Hanna Girma', phone: '+251911345678', address: 'CMC, Addis Ababa' },
    },
    {
      id: 'ORD-039', status: 'delivered', method: 'Cash on Delivery',
      time: 'Yesterday', unread: false,
      product: { name: 'Tomatoes 1kg', img: '🍅', qty: 2, unit: 'qtl', unitPrice: 6200 },
      buyer: { name: 'Dawit Alemu', phone: '+251911456789', address: 'Kazanchis, Addis Ababa' },
    },
  ];

  const fmt = (n) => n.toLocaleString('en-ET');

  const nextActionLabel = {
    pending:     { label: '✓ Mark as Paid',        cls: 'btn-primary' },
    paid:        { label: '📦 Mark as Processing', cls: 'btn-primary' },
    processing:  { label: '🚚 Mark as Shipped',    cls: 'btn-primary' },
    shipped:     { label: '✓ Mark as Delivered',   cls: 'btn-primary' },
  };

  const stepOf = { pending: 1, paid: 2, processing: 3, shipped: 4, delivered: 4 };

  page.innerHTML = `
    <!-- ══════════════════════════════════════════
         TOP ZONE (full width)
         ══════════════════════════════════════════ -->
    <div class="page-top">

      <!-- Header -->
      <div class="ph">
        <div>
          <h1 class="welcome-line">Orders</h1>
          <p>Manage incoming orders · <strong style="color:var(--brand)">Friday, Oct 3</strong></p>
        </div>
        <div class="actions">
          <button class="btn btn-ghost">⬇ Export CSV</button>
          <button class="btn btn-ghost">🔄 Refresh</button>
        </div>
      </div>

      <!-- Live notification banner -->
      <div class="notif-banner" id="notifBanner">
        <div class="pulse"></div>
        <div class="body">
          <strong>2 new orders</strong> need your attention
          <span class="sep">·</span>
          <span class="time">ORD-042, ORD-041 · just now</span>
        </div>
        <button class="btn btn-sm btn-soft" style="background:#fff">Review →</button>
        <button class="close" id="dismissNotif" aria-label="Dismiss">×</button>
      </div>

      <!-- Status tabs -->
      <div class="tabs">
        <button class="tab active">All <span class="count">24</span></button>
        <button class="tab">⏳ Pending <span class="count alert">2</span></button>
        <button class="tab">💳 Paid <span class="count">5</span></button>
        <button class="tab">📦 Processing <span class="count">3</span></button>
        <button class="tab">🚚 Shipped <span class="count">8</span></button>
        <button class="tab">✓ Delivered <span class="count">6</span></button>
        <button class="tab">✕ Cancelled <span class="count">0</span></button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-sm">
          <span style="color:var(--ink-4)">🔍</span>
          <input placeholder="Search order ID, buyer name, phone…" />
        </div>
        <select class="select-sm">
          <option>Newest first</option><option>Oldest first</option><option>Highest total</option>
        </select>
        <select class="select-sm">
          <option>Last 7 days</option><option>Today</option><option>This month</option><option>All time</option>
        </select>
        <div style="flex:1"></div>
        <span style="font-size:12.5px;color:var(--ink-3)">
          <strong style="color:var(--brand)">${orders.length}</strong> of 24 orders
        </span>
      </div>

    </div>

    <!-- ══════════════════════════════════════════
         BODY ZONE (2 columns)
         ══════════════════════════════════════════ -->
    <div class="page-body">

      <!-- LEFT: Orders list (all cards wrapped in ONE container) -->
      <div class="orders-list">
        ${orders.map(o => {
          const total = o.product.qty * o.product.unitPrice;
          const next = nextActionLabel[o.status];
          const step = stepOf[o.status];
          const isDone = o.status === 'delivered';
          return `
            <div class="order-card ${o.unread ? 'unread' : ''}" data-status="${o.status}">
              <div class="order-card__head">
                <div class="order-card__id">
                  ${o.id}
                  ${o.unread ? '<span class="new-tag">NEW</span>' : ''}
                  <span class="pill ${o.status}">${o.status}</span>
                </div>
                <div class="order-card__meta">
                  <span class="method">${o.method === 'Chapa' ? '💳' : '💵'} ${o.method}</span>
                  <span>${o.time}</span>
                </div>
              </div>

              <div class="order-card__body">
                <div class="product-line">
                  <div class="thumb">${o.product.img}</div>
                  <div class="info">
                    <div class="name">${o.product.name}</div>
                    <div class="qty">
                      <strong>${o.product.qty} ${o.product.unit}</strong>
                      × ${fmt(o.product.unitPrice)} ETB / ${o.product.unit}
                    </div>
                  </div>
                </div>
                <div class="total-block">
                  <div class="label">Order Total</div>
                  <div class="value">${fmt(total)} <span style="font-size:12px;color:var(--ink-3);font-weight:500">ETB</span></div>
                </div>
              </div>

              <div class="buyer-strip">
                <span class="item"><span class="ico">👤</span> <strong>${o.buyer.name}</strong></span>
                <span class="item"><span class="ico">📞</span> ${o.buyer.phone}</span>
                <span class="item"><span class="ico">📍</span> ${o.buyer.address}</span>
              </div>

              <div class="order-card__actions">
                <div class="left">
                  ${isDone
                    ? '<span style="color:var(--green);font-weight:600">✓ Completed</span>'
                    : `<span>Step ${step} of 4</span>`}
                </div>
                ${next ? `<button class="btn btn-sm ${next.cls}">${next.label}</button>` : ''}
                <button class="btn btn-sm btn-ghost">💬 Contact</button>
                <button class="btn btn-sm btn-ghost" style="padding:8px 12px">⋯</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <!-- RIGHT: Panel (sticky on wide screens) -->
      <aside class="panel">

        <!-- Today at a glance -->
        <div class="mini" style="padding:18px 0 0">
          <div class="mini__head" style="padding:0 20px 14px;margin:0">
            <h3>Today at a glance</h3>
          </div>
          <div class="quick-stats">
            <div class="qstat alert">
              <div class="num">2</div>
              <div class="lbl">Pending</div>
            </div>
            <div class="qstat">
              <div class="num">5</div>
              <div class="lbl">Paid</div>
            </div>
            <div class="qstat">
              <div class="num">8</div>
              <div class="lbl">Shipped</div>
            </div>
          </div>
        </div>

        <!-- Notifications feed -->
        <div class="mini">
          <div class="mini__head">
            <h3>🔔 Notifications</h3>
            <a class="link" href="#">Mark all read</a>
          </div>
          <div class="notif-list">
            <div class="notif-item unread">
              <div class="nico gold">🧾</div>
              <div class="nbody">
                <p><strong>New order ORD-042</strong> from Sara Bekele · 2 qtl Red Potatoes</p>
                <time>2 minutes ago</time>
              </div>
            </div>
            <div class="notif-item unread">
              <div class="nico blue">💳</div>
              <div class="nbody">
                <p><strong>Payment received</strong> for ORD-041 · 5,500 ETB via Chapa</p>
                <time>18 minutes ago</time>
              </div>
            </div>
            <div class="notif-item">
              <div class="nico green">🚚</div>
              <div class="nbody">
                <p><strong>Order ORD-040</strong> shipped to Hanna Girma</p>
                <time>2 hours ago</time>
              </div>
            </div>
            <div class="notif-item">
              <div class="nico amber">⚠️</div>
              <div class="nbody">
                <p><strong>Low stock:</strong> Red Onions — only 1 qtl left</p>
                <time>3 hours ago</time>
              </div>
            </div>
            <div class="notif-item">
              <div class="nico green">⭐</div>
              <div class="nbody">
                <p><strong>Dawit Alemu</strong> left you a 5-star review</p>
                <time>Yesterday</time>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick actions -->
        <div class="mini">
          <div class="mini__head">
            <h3>Quick actions</h3>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">
              📦 Bulk mark as shipped
            </button>
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">
              💬 Message pending buyers
            </button>
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">
              📊 Download report
            </button>
          </div>
        </div>

      </aside>

    </div>

    <!-- ══════════════════════════════════════════
         FOOTER (full width)
         ══════════════════════════════════════════ -->
    <div class="foot-bar" style="margin-top:22px">
      <div class="helper">
        <div class="dot-btn"><span class="dot"></span> Live sync enabled</div>
        <div class="dot-btn"><span class="dot" style="background:var(--gold)"></span> Auto-refresh every 60s</div>
      </div>
      <span class="muted" style="font-size:12px">Last updated 2 minutes ago</span>
    </div>
  `;

  /* Dismiss notification banner */
  document.getElementById('dismissNotif')?.addEventListener('click', () => {
    const b = document.getElementById('notifBanner');
    b.style.transition = 'opacity .2s, transform .2s';
    b.style.opacity = '0';
    b.style.transform = 'translateY(-8px)';
    setTimeout(() => b.remove(), 200);
  });

  /* Tab switching (visual only for now) */
  document.querySelectorAll('.tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });
</script>
</body>
</html>
