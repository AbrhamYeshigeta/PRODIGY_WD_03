<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Storefront · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'storefront' });

  // Use REAL registered data
  const storefront = {
    name: seller.businessName || 'My Store',
    type: seller.businessType || 'Farm',
    location: seller.city || 'Ethiopia',
    since: new Date(seller.createdAt || Date.now()).getFullYear().toString(),
    bio: seller.bio || 'Welcome to my store! I will be adding fresh produce soon.',
    verified: seller.verificationStatus === 'verified',
    rating: seller.rating || '—',
    ratingCount: seller.ratingCount || 0,
    fulfillment: seller.fulfillmentRate ? `${seller.fulfillmentRate}%` : '—',
    responseTime: seller.avgResponseMinutes ? `~${seller.avgResponseMinutes}m` : '—',
    orders: seller.ordersCompleted || 0,
    scaleLabel: seller.scale === 'retail' ? '🌾 Kilo Seller' : seller.scale === 'bulk' ? '🏭 Ton Seller' : '📦 Quintal Seller',
  };

  // Fetch real offers
  let offers = [];
  try {
    const res = await fetch('/api/sellers/me/offers', { credentials: 'include' });
    if (res.ok) {
      const json = await res.json();
      offers = json.data || [];
    }
  } catch (err) { }

  const fmt = (n) => n.toLocaleString('en-ET');

  page.innerHTML = `
    <div class="page-top">
      <div class="ph">
        <div>
          <h1 class="welcome-line">Storefront Preview</h1>
          <p>This is what buyers will see when they visit your public profile.</p>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="orders-list">
        <div class="store-hero">
          <div class="inner">
            <div class="avatar-lg">🚜</div>
            <div class="info">
              <h1>
                ${storefront.name}
                ${storefront.verified ? '<span class="verified">✓ Verified</span>' : '<span class="verified" style="background:var(--amber-tint);color:var(--amber);">⏳ Pending</span>'}
              </h1>
              <div class="meta">
                <span><strong style="text-transform:capitalize;">${storefront.type}</strong></span>
                <span>📍 ${storefront.location}</span>
                <span>Since <strong>${storefront.since}</strong></span>
              </div>
              <p class="bio">${storefront.bio}</p>
            </div>
          </div>
        </div>

        <div class="store-stats">
          <div class="cell"><div class="ico">⭐</div><div class="val">${storefront.rating}</div><div class="lbl">Rating (${storefront.ratingCount})</div></div>
          <div class="cell"><div class="ico">⚡</div><div class="val">${storefront.fulfillment}</div><div class="lbl">On-time</div></div>
          <div class="cell"><div class="ico">💬</div><div class="val">${storefront.responseTime}</div><div class="lbl">Response time</div></div>
          <div class="cell"><div class="ico">📦</div><div class="val">${storefront.orders}</div><div class="lbl">Orders completed</div></div>
        </div>

        <div class="sec-head" style="margin-top:24px">
          <h2>Their offers (${offers.length})</h2>
          <a class="link" href="/seller/offers.html">Manage offers →</a>
        </div>
        
        ${offers.length === 0 ? `
          <div class="empty-state" style="padding: 40px 20px; border: 1px solid var(--border); background: #fff;">
            <div class="es-icon">📦</div>
            <h3>No offers yet</h3>
            <p>Your storefront is empty. Add your first product so buyers can find you.</p>
            <a href="/seller/offers-new.html" class="btn btn-gold" style="margin-top:16px;">➕ Add Offer</a>
          </div>
        ` : `
          <div class="store-offers">
            ${offers.map(o => `
              <div class="store-offer">
                <div class="img"><span class="tag">${o.product?.category || 'Item'}</span>📦</div>
                <div class="body">
                  <div class="name">${o.product?.name || 'Product'}</div>
                  <div class="meta-row">
                    <div>
                      <div class="price">${fmt(o.pricePerUnit)} ETB / ${o.unit}</div>
                      <div class="eq">≈ ${o.pricePerKg} ETB / kg</div>
                    </div>
                    <div class="stock">${o.stock} ${o.unit} left</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `}

        <div class="sec-head" style="margin-top:24px"><h2>What buyers say</h2></div>
        <div class="empty-state" style="padding: 40px 20px; border: 1px solid var(--border); background: #fff;">
          <div class="es-icon">⭐</div>
          <h3>No reviews yet</h3>
          <p>When buyers receive your products, their reviews will appear here.</p>
        </div>
      </div>

      <aside class="panel">
        <div class="mini">
          <div class="mini__head"><h3>Trust signals</h3></div>
          <div class="notif-list">
            <div class="notif-item">
              <div class="nico ${storefront.verified ? 'green' : 'amber'}">${storefront.verified ? '✓' : '⏳'}</div>
              <div class="nbody"><p><strong>Fayda + TIN</strong> ${storefront.verified ? 'verified by Etfruit' : 'under review'}</p></div>
            </div>
            <div class="notif-item">
              <div class="nico blue">💳</div>
              <div class="nbody"><p><strong>Chapa payouts</strong> securely linked</p></div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  `;
</script>
</body>
</html>
