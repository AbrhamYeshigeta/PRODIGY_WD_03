<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payouts · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'payouts' });

  // ZERO STATE: Default values for new merchants
  const payouts = {
    next: 0,
    nextDate: 'No pending payouts',
    month: 0,
    lifetime: 0,
    lifetimeOrders: 0,
    pendingAmount: 0,
  };

  const bank = {
    name: seller.bank?.name || 'Not linked',
    account: seller.bank?.accountNumber ? '•••• ' + seller.bank.accountNumber.slice(-4) : '—',
    holder: seller.bank?.holderName || '—',
    verified: seller.verificationStatus === 'verified',
  };

  // ZERO STATE: Empty history
  const history = [];

  const fmt = (n) => n.toLocaleString('en-ET');

  page.innerHTML = `
    <div class="page-top">
      <div class="ph">
        <div>
          <h1 class="welcome-line">Payouts</h1>
          <p>Every birr accounted for · powered by Chapa</p>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="orders-list">
        <div class="payout-stats">
          <div class="payout-stat highlight">
            <div class="lbl">💰 Next payout</div>
            <div class="val">${fmt(payouts.next)}<small>ETB</small></div>
            <div class="sub">${payouts.nextDate}</div>
          </div>
          <div class="payout-stat">
            <div class="lbl">📅 This month</div>
            <div class="val">${fmt(payouts.month)}<small>ETB</small></div>
            <div class="sub">No earnings yet</div>
          </div>
          <div class="payout-stat">
            <div class="lbl">🏆 Lifetime</div>
            <div class="val">${fmt(payouts.lifetime)}<small>ETB</small></div>
            <div class="sub">Across 0 orders</div>
          </div>
        </div>

        <div class="sec-head">
          <h2>Payout account</h2>
          <a class="link" href="/seller/settings.html">Manage →</a>
        </div>
        <div class="bank-card">
          <div class="bank-logo">🏦</div>
          <div class="info">
            <strong>${bank.name}</strong>
            <div class="acct">${bank.account}</div>
            <div class="holder">${bank.holder}</div>
          </div>
          <div class="badges">
            <span class="pill ${bank.verified ? 'active' : 'pending'}">${bank.verified ? '✓ Active' : '⏳ Pending'}</span>
          </div>
        </div>

        <div class="sec-head" style="margin-top:24px">
          <h2>Payout history</h2>
        </div>
        
        ${history.length === 0 ? `
          <div class="empty-state" style="padding: 40px 20px; border: 1px solid var(--border); background: #fff;">
            <div class="es-icon">💸</div>
            <h3>No payouts yet</h3>
            <p>Once you make sales, your earnings will be automatically deposited to your bank account every Friday.</p>
            <a href="/seller/offers.html" class="btn btn-gold" style="margin-top:16px;">Start Selling</a>
          </div>
        ` : `
          <div class="card" style="padding:6px 22px">
            <!-- History rows go here -->
          </div>
        `}
      </div>

      <aside class="panel">
        <div class="mini">
          <div class="mini__head"><h3>How payouts work</h3></div>
          <div class="notif-list">
            <div class="notif-item"><div class="nico blue">💳</div><div class="nbody"><p>Buyer pays via <strong>Chapa</strong></p></div></div>
            <div class="notif-item"><div class="nico gold">⏱</div><div class="nbody"><p>Funds clear after <strong>2 days</strong></p></div></div>
            <div class="notif-item"><div class="nico green">🏦</div><div class="nbody"><p>Auto-deposited every <strong>Friday</strong></p></div></div>
          </div>
        </div>
      </aside>
    </div>
  `;
</script>
</body>
</html>
