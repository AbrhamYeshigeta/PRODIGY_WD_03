<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>

  <script type="module">
  import { renderShell } from '/js/seller/shell.js';

  // 1. Fetch real data from the backend
  let seller = null;
  let stats = null;

  try {
    const [sellerRes, statsRes] = await Promise.all([
      fetch('/api/sellers/me', { credentials: 'include' }),
      fetch('/api/sellers/me/stats', { credentials: 'include' })
    ]);

    if (sellerRes.ok) seller = (await sellerRes.json()).data;
    if (statsRes.ok) stats = (await statsRes.json()).data;
  } catch (err) {
    console.error("Failed to load dashboard data", err);
  }

  // 2. Guard
  if (!seller) window.location.href = '/seller/apply.html';
  else localStorage.setItem('etfruit.seller', JSON.stringify(seller));

  const page = renderShell({ active: 'dashboard' });

  // 3. Handle Pending Banner (If applicable)
  const isPending = seller.verificationStatus === 'pending';
  const pendingBanner = isPending ? `
    <div class="notif-banner" style="margin-bottom: 20px;">
      <div class="pulse" style="background: var(--gold-dark);"></div>
      <div class="body">
        <strong>Application Under Review:</strong> Your documents are being verified. You can preview your dashboard below, but you cannot publish offers until approved.
      </div>
    </div>
  ` : '';

  // 4. Render the Full Layout with ZERO DATA
  page.innerHTML = `
    <div class="page-top">
      ${pendingBanner}
      <div class="ph">
        <div>
          <h1 class="welcome-line">Good morning, ${seller.businessName} 👋</h1>
          <p>Here's how your store is doing today.</p>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" disabled>🧾 View Orders</button>
          <button class="btn btn-gold" disabled>➕ Add New Offer</button>
        </div>
      </div>

      <!-- TABS -->
      <div class="chips" style="margin-bottom: 20px;">
        <button class="chip active"><span class="ico">📊</span> Overview</button>
        <button class="chip"><span class="ico">💰</span> Sales</button>
        <button class="chip"><span class="ico">📦</span> Inventory</button>
        <button class="chip"><span class="ico">👥</span> Customers</button>
      </div>

      <!-- STATS ROW (ZEROED) -->
      <div class="stats">
        <div class="stat">
          <div class="stat__top"><div class="stat__ico">💰</div></div>
          <div class="stat__label">Revenue Today</div>
          <div class="stat__value">0 <small>ETB</small></div>
          <div class="stat__foot">No sales yet</div>
        </div>
        <div class="stat">
          <div class="stat__top"><div class="stat__ico blue">🧾</div></div>
          <div class="stat__label">New Orders</div>
          <div class="stat__value">0</div>
          <div class="stat__foot">Awaiting action</div>
        </div>
        <div class="stat">
          <div class="stat__top"><div class="stat__ico gold">🏷️</div></div>
          <div class="stat__label">Active Offers</div>
          <div class="stat__value">0</div>
          <div class="stat__foot">0 paused</div>
        </div>
        <div class="stat">
          <div class="stat__top"><div class="stat__ico amber">⭐</div></div>
          <div class="stat__label">Rating</div>
          <div class="stat__value">— <small>(0)</small></div>
          <div class="stat__foot">No reviews yet</div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="orders-list">
        
        <!-- RECENT ORDERS TABLE (EMPTY) -->
        <div class="card">
          <div class="card__head">
            <div><h3>Recent orders</h3><span class="sub">Latest activity from your buyers</span></div>
            <a class="link" href="/seller/orders.html">View all →</a>
          </div>
          <table class="tbl">
            <thead>
              <tr>
                <th>Order</th><th>Product</th><th>Buyer</th><th>Qty</th><th>Total</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" style="text-align: center; padding: 40px 20px; color: var(--ink-3);">
                  <div style="font-size: 24px; margin-bottom: 8px;">📭</div>
                  No orders yet. Your first sale will appear here.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

      <!-- RIGHT PANEL (EMPTY) -->
      <aside class="panel">
        
        <!-- PAYOUTS (ZEROED) -->
        <div class="mini">
          <div class="mini__head"><h3>💳 Next Payout</h3></div>
          <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:var(--brand);letter-spacing:-.5px;line-height:1">
            0 <span style="font-size:14px;color:var(--ink-3);font-weight:500">ETB</span>
          </div>
          <div class="muted" style="font-size:12px;margin-top:6px">No pending payouts</div>
          <div style="display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);align-items:center">
            <span style="font-size:11.5px;color:var(--ink-3)">Account not linked</span>
            <span class="pill paused" style="margin-left:auto">Pending</span>
          </div>
        </div>

        <!-- TOP OFFERS (EMPTY) -->
        <div class="mini">
          <div class="mini__head"><h3>🏷️ Top Offers</h3></div>
          <div class="empty-mini" style="padding: 20px 0;">
            <div class="big">📦</div>
            <p>You haven't added any offers yet.</p>
          </div>
        </div>

      </aside>
    </div>
  `;
</script>

</body>
</html>
