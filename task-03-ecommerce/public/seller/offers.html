<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Offers · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'offers' });

  /* Demo data (later: GET /api/sellers/me/offers) */
  const offers = [
    {
      id: 'OFF-001', status: 'active',
      product: 'Red Potatoes 2kg', img: '🥔', category: 'Root Vegetables',
      pricePerUnit: 8500, unit: 'qtl', pricePerKg: 85,
      stock: 12, sold: 45, views: 320, lowStock: false,
      updatedAt: '2 hours ago',
    },
    {
      id: 'OFF-002', status: 'active',
      product: 'Red Onions 1kg', img: '🧅', category: 'Root Vegetables',
      pricePerUnit: 5500, unit: 'qtl', pricePerKg: 55,
      stock: 1, sold: 28, views: 210, lowStock: true,
      updatedAt: 'Yesterday',
    },
    {
      id: 'OFF-003', status: 'paused',
      product: 'Fresh Carrots 1kg', img: '🥕', category: 'Root Vegetables',
      pricePerUnit: 4000, unit: 'qtl', pricePerKg: 40,
      stock: 8, sold: 12, views: 96, lowStock: false,
      updatedAt: '3 days ago',
    },
    {
      id: 'OFF-004', status: 'active',
      product: 'Tomatoes 1kg', img: '🍅', category: 'Fruit Vegetables',
      pricePerUnit: 6200, unit: 'qtl', pricePerKg: 62,
      stock: 15, sold: 33, views: 280, lowStock: false,
      updatedAt: '5 hours ago',
    },
    {
      id: 'OFF-005', status: 'active',
      product: 'Green Peppers 1kg', img: '🫑', category: 'Peppers',
      pricePerUnit: 7800, unit: 'qtl', pricePerKg: 78,
      stock: 6, sold: 18, views: 142, lowStock: false,
      updatedAt: '1 day ago',
    },
    {
      id: 'OFF-006', status: 'out_of_stock',
      product: 'Fresh Kale 1kg', img: '🥬', category: 'Leafy Greens',
      pricePerUnit: 3500, unit: 'qtl', pricePerKg: 35,
      stock: 0, sold: 22, views: 198, lowStock: true,
      updatedAt: '4 days ago',
    },
  ];

  const fmt = (n) => n.toLocaleString('en-ET');

  const statusLabel = {
    active: 'ACTIVE',
    paused: 'PAUSED',
    out_of_stock: 'OUT OF STOCK',
    draft: 'DRAFT',
  };

  page.innerHTML = `
    <div class="page-top">

      <!-- Header -->
      <div class="ph">
        <div>
          <h1 class="welcome-line">My Offers</h1>
          <p>Prices shown per <strong style="color:var(--brand)">quintal</strong> · buyers always see the ETB/kg equivalent</p>
        </div>
        <div class="actions">
          <button class="btn btn-ghost">⬇ Export</button>
          <a class="btn btn-gold" href="/seller/offers-new.html">➕ Add New Offer</a>
        </div>
      </div>

      <!-- Category chips -->
      <div class="chips">
        <button class="chip active"><span class="ico">🏷️</span> All Offers <span class="count">${offers.length}</span></button>
        <button class="chip"><span class="ico">🌱</span> Leafy Greens <span class="count">4</span></button>
        <button class="chip"><span class="ico">🥕</span> Root Vegetables <span class="count">12</span></button>
        <button class="chip"><span class="ico">🍅</span> Fruit Vegetables <span class="count">8</span></button>
        <button class="chip"><span class="ico">🫑</span> Peppers <span class="count">6</span></button>
        <button class="chip"><span class="ico">🥬</span> Herbs <span class="count">3</span></button>
        <button class="chip"><span class="ico">⚠️</span> Low Stock <span class="count">2</span></button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-sm">
          <span style="color:var(--ink-4)">🔍</span>
          <input placeholder="Search offers by product name…" />
        </div>
        <select class="select-sm">
          <option>All statuses</option>
          <option>Active</option>
          <option>Paused</option>
          <option>Out of stock</option>
        </select>
        <select class="select-sm">
          <option>Sort: Popular</option>
          <option>Highest price</option>
          <option>Lowest price</option>
          <option>Most sold</option>
          <option>Recently updated</option>
        </select>
        <div style="flex:1"></div>
        <span style="font-size:12.5px;color:var(--ink-3)">
          <strong style="color:var(--brand)">${offers.length}</strong> active offers
        </span>
      </div>

    </div>

    <div class="page-body">

      <!-- LEFT: Offers list -->
      <div class="orders-list">
        ${offers.map(o => `
          <div class="offer-row" data-status="${o.status}">
            <div class="offer-row__body">
              <div class="product-line">
                <div class="thumb">${o.img}</div>
                <div class="info">
                  <div class="head">
                    <span class="name">${o.product}</span>
                    <span class="pill ${o.status === 'active' ? 'active' : o.status === 'paused' ? 'paused' : 'cancelled'}">${statusLabel[o.status]}</span>
                    ${o.lowStock && o.status === 'active' ? '<span class="pill pending">⚠ LOW STOCK</span>' : ''}
                  </div>
                  <div class="meta">
                    <span class="price">${fmt(o.pricePerUnit)} ETB / ${o.unit}</span>
                    <span class="eq">≈ ${o.pricePerKg} ETB / kg</span>
                    <span>${o.category}</span>
                  </div>
                </div>
              </div>

              <div class="metrics">
                <div class="metric">
                  <div class="lbl">Stock</div>
                  <div class="val ${o.lowStock ? 'warn' : ''}">${o.stock} ${o.unit}</div>
                </div>
                <div class="metric">
                  <div class="lbl">Sold</div>
                  <div class="val">${o.sold} ${o.unit}</div>
                </div>
                <div class="metric">
                  <div class="lbl">Views</div>
                  <div class="val">${o.views}</div>
                </div>
              </div>
            </div>

            <div class="offer-row__actions">
              <div class="left">
                <span>Updated ${o.updatedAt}</span>
                <span>·</span>
                <span>Offer ID <strong>${o.id}</strong></span>
              </div>
              <button class="btn btn-sm btn-ghost">✏️ Edit</button>
              ${o.status === 'active'
                ? `<button class="btn btn-sm btn-ghost">⏸ Pause</button>`
                : `<button class="btn btn-sm btn-primary">▶ Resume</button>`}
              <button class="btn btn-sm btn-ghost" style="padding:8px 12px">⋯</button>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- RIGHT: Panel -->
      <aside class="panel">

        <!-- Performance summary -->
        <div class="mini">
          <div class="mini__head">
            <h3>Catalog performance</h3>
          </div>

          <div class="row-item">
            <div class="ico">📦</div>
            <div class="body">
              <strong>${offers.length} active offers</strong>
              <small>Across 4 categories</small>
            </div>
          </div>
          <div class="row-item">
            <div class="ico gold">👁️</div>
            <div class="body">
              <strong>1,246 views</strong>
              <small>Last 30 days</small>
            </div>
            <span class="val">+18%</span>
          </div>
          <div class="row-item">
            <div class="ico blue">🛒</div>
            <div class="body">
              <strong>158 sold</strong>
              <small>158 quintals total</small>
            </div>
            <span class="val">+12%</span>
          </div>
          <div class="row-item">
            <div class="ico amber">⚠️</div>
            <div class="body">
              <strong>2 need attention</strong>
              <small>Low stock alerts</small>
            </div>
          </div>
        </div>

        <!-- Tips -->
        <div class="mini">
          <div class="mini__head">
            <h3>💡 Tips to sell more</h3>
          </div>
          <div class="notif-list">
            <div class="notif-item">
              <div class="nico gold">📸</div>
              <div class="nbody">
                <p>Offers with <strong>4+ photos</strong> sell 40% faster</p>
              </div>
            </div>
            <div class="notif-item">
              <div class="nico blue">💰</div>
              <div class="nbody">
                <p>You're <strong>7% below</strong> market average — great pricing</p>
              </div>
            </div>
            <div class="notif-item">
              <div class="nico green">⚡</div>
              <div class="nbody">
                <p>Sellers with <strong>same-day handling</strong> get 2× orders</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick actions -->
        <div class="mini">
          <div class="mini__head">
            <h3>Quick actions</h3>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <a class="btn btn-gold btn-block" href="/seller/offers-new.html" style="justify-content:flex-start">➕ Add new offer</a>
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">📦 Bulk update stock</button>
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">💲 Bulk adjust prices</button>
          </div>
        </div>

      </aside>

    </div>

    <div class="foot-bar" style="margin-top:22px">
      <div class="helper">
        <div class="dot-btn"><span class="dot"></span> Catalog in sync</div>
        <div class="dot-btn"><span class="dot" style="background:var(--gold)"></span> Prices auto-normalized to ETB/kg</div>
      </div>
      <span class="muted" style="font-size:12px">Last updated 2 minutes ago</span>
    </div>
  `;

  /* Chip switching */
  document.querySelectorAll('.chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });
</script>
</body>
</html>
