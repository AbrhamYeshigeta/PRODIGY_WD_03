<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Offer · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
  <style>
    .product-search-shell { position: relative; margin-bottom: 14px; }
    .product-results {
      display: grid; gap: 8px; margin-top: 10px;
      max-height: 290px; overflow: auto; padding-right: 4px;
    }
    .product-result-item {
      width: 100%; display: flex; align-items: center; gap: 12px;
      border: 1px solid var(--border, #dfe6dc); background: #fff;
      border-radius: 12px; padding: 10px 12px; text-align: left;
      cursor: pointer; transition: all 0.18s ease;
      color: var(--brand, #0d3d2e);
    }
    .product-result-item:hover,
    .product-result-item:focus-visible {
      border-color: rgba(13,61,46,0.28);
      background: rgba(13,61,46,0.03);
      outline: none;
    }
    .product-result-item.is-selected {
      border-color: rgba(13,61,46,0.5);
      background: rgba(13,61,46,0.06);
      box-shadow: 0 0 0 3px rgba(13,61,46,0.06);
    }
    .product-result-thumb {
      width: 40px; height: 40px; border-radius: 10px;
      background: rgba(13,61,46,0.04);
      border: 1px solid rgba(13,61,46,0.12);
      display: grid; place-items: center; font-size: 22px;
      flex-shrink: 0;
    }
    .product-result-copy {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 3px;
    }
    .product-result-copy strong {
      font-size: 13.5px; line-height: 1.3;
      color: var(--brand, #0d3d2e);
    }
    .product-result-copy small {
      font-size: 11.5px; color: var(--ink-3, #66726b);
    }
    .product-result-arrow {
      font-size: 11px; color: var(--ink-3, #66726b);
      font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; flex-shrink: 0;
    }
    .product-empty {
      border: 1px dashed var(--border, #dfe6dc);
      background: rgba(13,61,46,0.02);
      color: var(--ink-3, #66726b);
      border-radius: 12px; padding: 14px 16px; font-size: 12.5px;
    }
  </style>
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'offers-new' });

  /* ═══ UNIT CONFIG ═══ */
  const UNITS = {
    kg:      { short: 'kg',  long: 'kg',         factor: 1,    icon: '🌾', label: 'Kilo',
               pricePlaceholder: '85.00',    stockPlaceholder: '5000', comparePlaceholder: '100.00' },
    quintal: { short: 'qtl', long: 'quintal',    factor: 100,  icon: '📦', label: 'Quintal',
               pricePlaceholder: '8500.00',  stockPlaceholder: '50',   comparePlaceholder: '10000.00' },
    ton:     { short: 't',   long: 'metric ton', factor: 1000, icon: '🏭', label: 'Ton',
               pricePlaceholder: '85000.00', stockPlaceholder: '5',    comparePlaceholder: '100000.00' },
  };

  /* Default to the seller's registration scale */
  const DEFAULT_UNIT_MAP = { retail: 'kg', wholesale: 'quintal', bulk: 'ton' };
  let unit = DEFAULT_UNIT_MAP[seller.scale] || 'quintal';

  const MARKET_AVG_PER_KG = 82;  /* ETB per kg — later: from API */
  const DEFAULT_MARKET_PRODUCT = 'Red Potatoes 2kg';

  const catalog = [
    { slug: 'red-potatoes-2kg',    name: 'Red Potatoes 2kg',     category: 'Root Vegetables', image: '🥔' },
    { slug: 'white-potatoes-2kg',  name: 'White Potatoes 2kg',   category: 'Root Vegetables', image: '🥔' },
    { slug: 'red-onions-1kg',      name: 'Red Onions 1kg',       category: 'Root Vegetables', image: '🧅' },
    { slug: 'fresh-carrots-1kg',   name: 'Fresh Carrots 1kg',    category: 'Root Vegetables', image: '🥕' },
    { slug: 'tomatoes-1kg',        name: 'Tomatoes 1kg',         category: 'Fruit Vegetables', image: '🍅' },
    { slug: 'green-peppers-1kg',   name: 'Green Peppers 1kg',    category: 'Peppers', image: '🫑' },
    { slug: 'purple-eggplant-2pcs',name: 'Purple Eggplant (2 pcs)', category: 'Fruit Vegetables', image: '🍆' },
    { slug: 'baby-spinach-250g',   name: 'Baby Spinach 250g',    category: 'Leafy Greens', image: '🌿' },
    { slug: 'fresh-broccoli',      name: 'Organic Broccoli',     category: 'Leafy Greens', image: '🥦' },
    { slug: 'fresh-cabbage',       name: 'Green Cabbage',        category: 'Leafy Greens', image: '🥬' },
    { slug: 'sweet-bananas',       name: 'Sweet Banana Bunch',   category: 'Fruits', image: '🍌' },
    { slug: 'organic-avocados',    name: 'Organic Hass Avocados',category: 'Fruits', image: '🥑' },
  ];

  let selectedProductSlug = null;

  /* ═══ HELPERS ═══ */
  const fmtETB = (v) => v.toLocaleString('en-ET', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtInt = (v) => v.toLocaleString('en-ET');

  /* ═══ PRODUCT SEARCH + RESULTS ═══ */
  function renderProductResults(query = '') {
    const searchText = query.trim().toLowerCase();
    const container = document.getElementById('productResults');
    if (!container) return;

    if (!searchText) { container.innerHTML = ''; return; }

    const results = catalog
      .filter((p) => `${p.name} ${p.category}`.toLowerCase().includes(searchText))
      .slice(0, 6);

    if (!results.length) {
      container.innerHTML = '<div class="product-empty">No matching product found. Try another name or category.</div>';
      return;
    }

    container.innerHTML = results.map((product) => `
      <button
        type="button"
        class="product-result-item ${selectedProductSlug === product.slug ? 'is-selected' : ''}"
        data-slug="${product.slug}"
        aria-label="Choose ${product.name}"
      >
        <span class="product-result-thumb">${product.image}</span>
        <span class="product-result-copy">
          <strong>${product.name}</strong>
          <small>${product.category}</small>
        </span>
        <span class="product-result-arrow">Select</span>
      </button>
    `).join('');

    container.querySelectorAll('.product-result-item').forEach((button) => {
      button.addEventListener('click', () => {
        const slug = button.dataset.slug;
        const product = catalog.find((entry) => entry.slug === slug);
        if (!product) return;

        selectedProductSlug = slug;
        const searchInput = document.getElementById('prodSearchInput');
        if (searchInput) searchInput.value = product.name;
        updateSelectedProduct(product);
        renderProductResults(product.name);
        updatePricingTip(product.name);
      });
    });
  }

  function updateSelectedProduct(product) {
    if (!product) return;
    const previewImg = document.getElementById('previewImg');
    const previewName = document.getElementById('previewName');
    const previewCat = document.getElementById('previewCat');
    if (previewImg) previewImg.textContent = product.image;
    if (previewName) previewName.textContent = product.name;
    if (previewCat) previewCat.textContent = product.category;
  }

  /* ═══ PRICE PREVIEW ═══ */
  function renderPricePreview() {
    const priceInput = document.getElementById('priceInput');
    const previewPrice = document.getElementById('previewPrice');
    const previewEq = document.getElementById('previewEq');
    const pricePreview = document.getElementById('pricePreview');
    const u = UNITS[unit];

    const v = parseFloat(priceInput?.value || '');
    if (!v || v <= 0) {
      previewPrice.textContent = '— ETB';
      previewEq.textContent = `per ${u.short}`;
      pricePreview.innerHTML = `<div style="color:var(--ink-3);font-size:12.5px">Enter a price to see the buyer-facing display and ETB/kg comparison.</div>`;
      return;
    }

    const perKg = (v / u.factor).toFixed(2);
    const fmtPrice = fmtETB(v);

    previewPrice.textContent = `${fmtPrice} ETB`;
    previewEq.textContent = `per ${u.short} · ≈ ${perKg} ETB/kg`;

    pricePreview.innerHTML = `
      <div class="main">${fmtPrice} ETB / ${u.long}</div>
      <div class="eq">Buyers will see this. Normalized to <strong>${perKg} ETB / kg</strong> for ranking.</div>
    `;
  }

  /* ═══ PRICING TIP ═══ */
  function updatePricingTip(productName) {
    const el = document.getElementById('tipAvg');
    const nameEl = document.getElementById('tipProduct');
    if (!el) return;
    const u = UNITS[unit];
    const perUnit = MARKET_AVG_PER_KG * u.factor;
    el.textContent = `${fmtInt(perUnit)} ETB / ${u.short}`;
    if (nameEl) nameEl.textContent = productName || DEFAULT_MARKET_PRODUCT;
  }

  /* ═══ REFRESH EVERYTHING when unit changes ═══ */
  function refreshUnitUI() {
    const u = UNITS[unit];

    /* All labels with data-unit-short / data-unit-long */
    document.querySelectorAll('[data-unit-short]').forEach(el => el.textContent = u.short);
    document.querySelectorAll('[data-unit-long]').forEach(el => el.textContent = u.long);

    /* Placeholders */
    const priceInput   = document.getElementById('priceInput');
    const stockInput   = document.getElementById('stockInput');
    const compareInput = document.getElementById('compareInput');
    const minOrder     = document.getElementById('minOrderInput');

    if (priceInput)   priceInput.placeholder   = u.pricePlaceholder;
    if (stockInput)   stockInput.placeholder   = u.stockPlaceholder;
    if (compareInput) compareInput.placeholder = u.comparePlaceholder;
    if (minOrder)     minOrder.value = '1';

    /* Clear price on unit switch so we don't misinterpret a number */
    if (priceInput && priceInput.value) {
      priceInput.value = '';
    }

    /* Update active tab */
    document.querySelectorAll('.unit-picker .up-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.unit === unit);
    });

    /* Refresh dependent UI */
    renderPricePreview();
    updatePricingTip(
      selectedProductSlug
        ? catalog.find(c => c.slug === selectedProductSlug)?.name
        : null
    );
  }

  /* ═══ RENDER PAGE ═══ */
  page.innerHTML = `
    <div class="page-top">

      <!-- Header with unit picker -->
      <div class="ph">
        <div>
          <h1 class="welcome-line">Add New Offer</h1>
          <p>Pick a product, choose your unit, set your price. Buyers always see the ETB/kg equivalent.</p>
        </div>
        <div class="actions">
          <a class="btn btn-ghost" href="/seller/offers.html">← Back to Offers</a>

          <div class="unit-picker" role="group" aria-label="Selling unit">
            <span class="up-label">Selling unit</span>
            <div class="up-tabs">
              <button type="button" class="up-tab" data-unit="kg">🌾 kg</button>
              <button type="button" class="up-tab" data-unit="quintal">📦 qtl</button>
              <button type="button" class="up-tab" data-unit="ton">🏭 ton</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="page-body">

      <div class="orders-list">

        <!-- Step 1 -->
        <div class="form-card">
          <div class="form-section">
            <h3><span>1.</span> Choose a product <span class="num">From catalog</span></h3>
            <p class="sec-sub">Search by name or category to select the item you want to sell.</p>

            <div class="field product-search-shell">
              <label for="prodSearchInput" style="margin-bottom:8px;display:block">Choose a product</label>
              <div class="search-box block" id="prodSearch" aria-label="Choose a product search">
                <span class="s-icon">🔍</span>
                <input id="prodSearchInput" placeholder="Search products by name or category…" autocomplete="off" aria-label="Search products by name or category" />
                <button class="s-clear" type="button" data-clear aria-label="Clear search">✕</button>
                <span class="s-kbd">⌘K</span>
              </div>
              <div id="productResults" class="product-results" aria-live="polite"></div>
            </div>

            <p class="help" style="margin-top:14px">
              Can't find your product? <a href="#" style="color:var(--brand);font-weight:600">Request a new one →</a>
            </p>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="form-card">
          <div class="form-section">
            <h3><span>2.</span> Set your price <span class="num">In <span data-unit-short>qtl</span></span></h3>
            <p class="sec-sub">Your price is shown to buyers in <strong data-unit-long>quintal</strong>. We also compute the ETB/kg equivalent for fair ranking.</p>

            <div class="field">
              <label>Your price (ETB / <span data-unit-long>quintal</span>) <span class="req">*</span></label>
              <input class="input" id="priceInput" type="number" step="0.01" min="0" placeholder="8500.00" />
              <div class="price-preview" id="pricePreview">
                <div style="color:var(--ink-3);font-size:12.5px">Enter a price to see the buyer-facing display and ETB/kg comparison.</div>
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label>Compare price <span class="opt">(optional)</span></label>
                <input class="input" id="compareInput" type="number" step="0.01" min="0" placeholder="10000.00" />
                <div class="help">Shows a strikethrough to signal a discount.</div>
              </div>
              <div class="field">
                <label>Stock (<span data-unit-short>qtl</span>) <span class="req">*</span></label>
                <input class="input" id="stockInput" type="number" min="1" placeholder="50" />
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label>Minimum order (<span data-unit-short>qtl</span>) <span class="req">*</span></label>
                <input class="input" id="minOrderInput" type="number" min="1" value="1" />
              </div>
              <div class="field">
                <label>Shipping fee (ETB)</label>
                <input class="input" type="number" step="0.01" min="0" value="0.00" />
              </div>
            </div>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="form-card">
          <div class="form-section">
            <h3><span>3.</span> Fulfillment & details</h3>
            <p class="sec-sub">Faster handling = more visibility. Sellers with same-day handling get 2× orders.</p>

            <div class="grid-2">
              <div class="field">
                <label>Handling time <span class="req">*</span></label>
                <select class="input">
                  <option>Same day</option>
                  <option selected>1 day</option>
                  <option>2 days</option>
                  <option>3 days</option>
                </select>
              </div>
              <div class="field">
                <label>Delivery coverage</label>
                <select class="input">
                  <option>Addis Ababa only</option>
                  <option selected>Addis Ababa + Oromia</option>
                  <option>Nationwide</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label>Photos <span class="opt">(up to 4 — offers with photos sell 40% faster)</span></label>
              <label class="upload-box" data-upload>
                <span class="ico">📷</span>
                <span class="upload-text">Click to upload — JPG / PNG, max 5MB each</span>
                <input type="file" accept="image/*" multiple hidden />
              </label>
            </div>

            <div class="field">
              <label>Notes for buyers <span class="opt">(optional)</span></label>
              <textarea class="input" placeholder="Grown without pesticides, harvested daily. Delivery within 24 hours inside Addis."></textarea>
              <div class="help">Buyers see this on your offer page and storefront.</div>
            </div>
          </div>
        </div>

        <!-- Step 4 · Review + Hero Publish -->
        <div class="form-card">
          <div class="form-section">
            <h3><span>4.</span> Review & publish</h3>
            <p class="sec-sub">Double-check your details. You can edit or pause this offer anytime after publishing.</p>

            <div class="buyer-strip" style="background:var(--bg-2);border-radius:var(--r-md);padding:14px 18px;display:flex;gap:20px;flex-wrap:wrap;border:none">
              <span class="item" style="display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)">
                <span style="color:var(--ink-3)">Status:</span>
                <strong style="color:var(--brand)">Ready to publish</strong>
              </span>
              <span class="item" style="display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)">
                <span style="color:var(--ink-3)">Unit:</span>
                <strong style="color:var(--brand)" data-unit-short>qtl</strong>
              </span>
              <span class="item" style="display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)">
                <span style="color:var(--ink-3)">Visible to buyers:</span>
                <strong style="color:var(--brand)">Immediately</strong>
              </span>
            </div>

            <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center">
              <button class="btn btn-ghost">👁️ Preview as buyer</button>
              <button class="btn btn-ghost">💾 Save as draft</button>
              <div style="flex:1;min-width:20px"></div>
              <button class="btn-hero" id="publishBtn" type="button">
                <span>🌱 Publish Offer</span>
                <span class="arrow">→</span>
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT PANEL -->
      <aside class="panel">

        <div class="mini">
          <div class="mini__head"><h3>Buyer preview</h3></div>
          <div style="background:var(--brand-tint);border-radius:var(--r-md);padding:14px;text-align:center">
            <div style="font-size:44px;line-height:1;margin-bottom:8px" id="previewImg">🥔</div>
            <div style="font-family:var(--serif);font-size:14px;font-weight:700;color:var(--brand)" id="previewName">Select a product</div>
            <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px" id="previewCat">—</div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px dashed rgba(13,61,46,.15)">
              <div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--brand)" id="previewPrice">— ETB</div>
              <div style="font-size:11px;color:var(--ink-3);margin-top:2px" id="previewEq">per qtl</div>
            </div>
          </div>
        </div>

        <div class="mini">
          <div class="mini__head"><h3>Publish checklist</h3></div>
          <div class="notif-list">
            <div class="notif-item">
              <div class="nico green">✓</div>
              <div class="nbody"><p><strong>Verified seller</strong> — you're cleared to publish</p></div>
            </div>
            <div class="notif-item">
              <div class="nico green">✓</div>
              <div class="nbody"><p><strong>Chapa payouts</strong> — subaccount is active</p></div>
            </div>
            <div class="notif-item">
              <div class="nico gold">!</div>
              <div class="nbody"><p>Add <strong>at least 2 photos</strong> to boost visibility</p></div>
            </div>
            <div class="notif-item">
              <div class="nico blue">→</div>
              <div class="nbody"><p>Prices are <strong>auto-normalized to ETB/kg</strong> for ranking</p></div>
            </div>
          </div>
        </div>

        <div class="mini">
          <div class="mini__head"><h3>💡 Pricing tip</h3></div>
          <div class="nbody" style="font-size:12.5px;color:var(--ink-2);line-height:1.6">
            For <strong id="tipProduct">${DEFAULT_MARKET_PRODUCT}</strong>, the current market average is
            <strong style="color:var(--brand);font-family:var(--serif);font-size:14px" id="tipAvg">8,200 ETB / qtl</strong>.
            Price below that to appear first in the buyer's list.
          </div>
        </div>

      </aside>

    </div>

    <div class="foot-bar" style="margin-top:22px">
      <div class="helper">
        <div class="dot-btn"><span class="dot"></span> Draft auto-saves</div>
        <div class="dot-btn"><span class="dot" style="background:var(--gold)"></span> Publish is instant</div>
      </div>
      <span class="muted" style="font-size:12px">All fields required unless marked optional</span>
    </div>
  `;

  /* ═══ WIRE UP ═══ */
  const searchInput = document.getElementById('prodSearchInput');
  const clearButton = document.querySelector('[data-clear]');

  searchInput?.addEventListener('input', (event) => {
    const query = event.target.value;
    document.getElementById('prodSearch')?.classList.toggle('has-value', Boolean(query.trim()));
    renderProductResults(query);
  });

  clearButton?.addEventListener('click', () => {
    if (!searchInput) return;
    searchInput.value = '';
    searchInput.focus();
    document.getElementById('prodSearch')?.classList.remove('has-value');
    selectedProductSlug = null;
    renderProductResults('');
  });

  /* ⌘K / Ctrl+K focuses search */
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      searchInput?.focus();
      searchInput?.select();
    }
  });

  /* Unit picker tabs */
  document.querySelectorAll('.unit-picker .up-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const next = tab.dataset.unit;
      if (!next || next === unit) return;
      unit = next;
      refreshUnitUI();
    });
  });

  /* Price input live update */
  document.getElementById('priceInput')?.addEventListener('input', renderPricePreview);

  /* Upload box feedback */
  document.querySelectorAll('[data-upload]').forEach(box => {
    const input = box.querySelector('input[type=file]');
    const text = box.querySelector('.upload-text');
    input?.addEventListener('change', () => {
      if (input.files && input.files.length) {
        box.classList.add('uploaded');
        text.textContent = `✓ ${input.files.length} photo${input.files.length > 1 ? 's' : ''} selected`;
      }
    });
  });

  /* Publish */
  document.getElementById('publishBtn')?.addEventListener('click', () => {
    /* Later: POST /api/sellers/me/offers with { productSlug, unit, pricePerUnit, stock, ... } */
    window.location.href = '/seller/offers.html';
  });

  /* ═══ INITIAL STATE ═══ */
  renderProductResults('');

  const defaultProduct = catalog[0];
  if (defaultProduct) {
    selectedProductSlug = defaultProduct.slug;
    updateSelectedProduct(defaultProduct);
  }

  /* Apply initial unit (from seller.scale) to all labels */
  refreshUnitUI();
</script>
</body>
</html>
