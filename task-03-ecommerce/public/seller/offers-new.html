<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Offer · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
  <style>
    .product-search-shell { position: relative; margin-bottom: 14px; }
    .product-results { display: grid; gap: 8px; margin-top: 10px; max-height: 290px; overflow: auto; padding-right: 4px; }
    .product-result-item { width: 100%; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); background: #fff; border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; transition: all 0.18s ease; color: var(--brand); }
    .product-result-item:hover, .product-result-item:focus-visible { border-color: rgba(13,61,46,0.28); background: rgba(13,61,46,0.03); outline: none; }
    .product-result-item.is-selected { border-color: rgba(13,61,46,0.5); background: rgba(13,61,46,0.06); box-shadow: 0 0 0 3px rgba(13,61,46,0.06); }
    .product-result-thumb { width: 40px; height: 40px; border-radius: 10px; background: rgba(13,61,46,0.04); border: 1px solid rgba(13,61,46,0.12); display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
    .product-result-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .product-result-copy strong { font-size: 13.5px; line-height: 1.3; color: var(--brand); }
    .product-result-copy small { font-size: 11.5px; color: var(--ink-3); }
    .product-result-arrow { font-size: 11px; color: var(--ink-3); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
    .product-empty { border: 1px dashed var(--border); background: rgba(13,61,46,0.02); color: var(--ink-3); border-radius: 12px; padding: 14px 16px; font-size: 12.5px; }
  </style>
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'offers-new' });

  // UPDATED UNITS CONFIG
  const UNITS = {
    kg:      { short: 'kg',  long: 'kg',         factor: 1,    icon: '🌾', label: 'Kilo',    pricePlaceholder: '85.00' },
    piece:   { short: 'pc',  long: 'piece',      factor: 1,    icon: '🍉', label: 'Piece',   pricePlaceholder: '150.00' },
    bunch:   { short: 'bch', long: 'bunch',      factor: 1,    icon: '🥬', label: 'Bunch',   pricePlaceholder: '50.00' },
    pack:    { short: 'pk',  long: 'pack',       factor: 1,    icon: '📦', label: 'Pack',    pricePlaceholder: '120.00' },
    quintal: { short: 'qtl', long: 'quintal',    factor: 100,  icon: '📦', label: 'Quintal', pricePlaceholder: '8500.00' },
    ton:     { short: 't',   long: 'metric ton', factor: 1000, icon: '🏭', label: 'Ton',     pricePlaceholder: '85000.00' },
  };

  const DEFAULT_UNIT_MAP = { retail: 'kg', wholesale: 'quintal', bulk: 'ton' };
  let unit = DEFAULT_UNIT_MAP[seller.scale] || 'kg';
  let selectedProductSlug = null;

  const catalog = [
    { slug: 'red-potatoes', name: 'Red Potatoes', category: 'Root Vegetables', image: '🥔' },
    { slug: 'red-onions',   name: 'Red Onions',   category: 'Root Vegetables', image: '🧅' },
    { slug: 'watermelon',   name: 'Watermelon',   category: 'Fruits', image: '🍉' },
    { slug: 'cabbage',      name: 'Green Cabbage', category: 'Leafy Greens', image: '🥬' },
    { slug: 'apples',       name: 'Red Apples',    category: 'Fruits', image: '🍎' },
    { slug: 'kale',         name: 'Fresh Kale',    category: 'Leafy Greens', image: '🌿' },
  ];

  const fmtETB = (v) => v.toLocaleString('en-ET', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  /* ── RENDER PRICE PREVIEW ── */
  function renderPricePreview() {
    const u = UNITS[unit];
    const priceVal = parseFloat(document.getElementById('priceInput')?.value || '');
    const estWeightVal = parseFloat(document.getElementById('estWeightInput')?.value || '');
    
    const previewPrice = document.getElementById('previewPrice');
    const previewEq = document.getElementById('previewEq');
    const pricePreview = document.getElementById('pricePreview');

    if (!priceVal || priceVal <= 0) {
      previewPrice.textContent = '— ETB';
      previewEq.textContent = `per ${u.short}`;
      pricePreview.innerHTML = `<div style="color:var(--ink-3);font-size:12.5px">Enter a price to see the buyer-facing display and ETB/kg comparison.</div>`;
      return;
    }

    let perKg = 0;
    
    // Logic for piece, bunch, pack
    if (['piece', 'bunch', 'pack'].includes(unit)) {
      if (estWeightVal > 0) {
        perKg = (priceVal / estWeightVal).toFixed(2);
      } else {
        perKg = '?';
      }
    } else {
      perKg = (priceVal / u.factor).toFixed(2);
    }

    const fmtPrice = fmtETB(priceVal);

    previewPrice.textContent = `${fmtPrice} ETB`;
    previewEq.textContent = `per ${u.long}` + (perKg !== '?' ? ` · ≈ ${perKg} ETB/kg` : '');

    pricePreview.innerHTML = `
      <div class="main">${fmtPrice} ETB / ${u.long}</div>
      <div class="eq">Buyers will see this. ${perKg !== '?' ? `Normalized to <strong>${perKg} ETB / kg</strong> for ranking.` : 'Please enter the estimated weight to calculate ETB/kg.'}</div>
    `;
  }

  /* ── REFRESH UI ON UNIT CHANGE ── */
  function refreshUnitUI() {
    const u = UNITS[unit];

    document.querySelectorAll('[data-unit-short]').forEach(el => el.textContent = u.short);
    document.querySelectorAll('[data-unit-long]').forEach(el => el.textContent = u.long);

    const priceInput = document.getElementById('priceInput');
    if (priceInput) priceInput.placeholder = u.pricePlaceholder;

    // Show/Hide the Estimated Weight field
    const estWeightField = document.getElementById('estWeightField');
    if (estWeightField) {
      if (['piece', 'bunch', 'pack'].includes(unit)) {
        estWeightField.style.display = 'block';
      } else {
        estWeightField.style.display = 'none';
      }
    }

    document.querySelectorAll('.unit-picker .up-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.unit === unit);
    });

    renderPricePreview();
  }

  /* ── RENDER PAGE ── */
  page.innerHTML = `
    <div class="page-top">
      <div class="ph">
        <div>
          <h1 class="welcome-line">Add New Offer</h1>
          <p>Choose your selling unit. The system auto-calculates ETB/kg for fair ranking.</p>
        </div>
        <div class="actions">
          <a class="btn btn-ghost" href="/seller/offers.html">← Back to Offers</a>
          
          <div class="unit-picker">
            <span class="up-label">UNIT</span>
            <div class="up-tabs">
              <button type="button" class="up-tab" data-unit="kg">🌾 kg</button>
              <button type="button" class="up-tab" data-unit="piece">🍉 pc</button>
              <button type="button" class="up-tab" data-unit="bunch">🥬 bch</button>
              <button type="button" class="up-tab" data-unit="pack">📦 pk</button>
              <button type="button" class="up-tab" data-unit="quintal">🧺 qtl</button>
              <button type="button" class="up-tab" data-unit="ton">🏭 ton</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="orders-list">
        
        <!-- Step 1: Product -->
        <div class="form-card">
          <div class="form-section">
            <h3><span>1.</span> Choose a product</h3>
            <p class="sec-sub">Select from the Etfruit catalog.</p>
            <div class="field product-search-shell">
              <div class="search-box block" id="prodSearch">
                <span class="s-icon">🔍</span>
                <input id="prodSearchInput" placeholder="Search products by name..." autocomplete="off" />
              </div>
              <div id="productResults" class="product-results"></div>
            </div>
          </div>
        </div>

        <!-- Step 2: Pricing -->
        <div class="form-card">
          <div class="form-section">
            <h3><span>2.</span> Set your price <span class="num">In <span data-unit-short>kg</span></span></h3>
            <p class="sec-sub">Your price is shown to buyers in <strong data-unit-long>kg</strong>.</p>

            <div class="field">
              <label>Your price (ETB / <span data-unit-long>kg</span>) <span class="req">*</span></label>
              <input class="input" id="priceInput" type="number" step="0.01" min="0" />
              <div class="price-preview" id="pricePreview" style="margin-top:10px;">
                <div style="color:var(--ink-3);font-size:12.5px">Enter a price to see the buyer-facing display.</div>
              </div>
            </div>

            <!-- ESTIMATED WEIGHT FIELD (Dynamic) -->
            <div class="field" id="estWeightField" style="display: none; background: var(--bg-2); padding: 12px; border-radius: 10px; border: 1px dashed var(--border);">
              <label style="color: var(--brand);">Estimated Weight per <span data-unit-long>piece</span> (kg) <span class="req">*</span></label>
              <input class="input" id="estWeightInput" type="number" step="0.1" min="0" placeholder="e.g. 5 for a Watermelon" />
              <div class="help" style="font-size: 11.5px; margin-top: 4px;">This helps buyers compare your price per kg against others.</div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label>Stock (<span data-unit-short>kg</span>) <span class="req">*</span></label>
                <input class="input" id="stockInput" type="number" min="1" placeholder="50" />
              </div>
              <div class="field">
                <label>Minimum order (<span data-unit-short>kg</span>) <span class="req">*</span></label>
                <input class="input" id="minOrderInput" type="number" min="1" value="1" />
              </div>
            </div>
          </div>
        </div>

        <!-- Step 3: Publish -->
        <div class="form-card">
          <div class="form-section">
            <button class="btn-hero" id="publishBtn" type="button" style="width: 100%;">
              <span>🌱 Publish Offer</span>
            </button>
          </div>
        </div>

      </div>

      <!-- RIGHT PANEL: PREVIEW -->
      <aside class="panel">
        <div class="mini">
          <div class="mini__head"><h3>Buyer preview</h3></div>
          <div style="background:var(--brand-tint);border-radius:var(--r-md);padding:14px;text-align:center">
            <div style="font-size:44px;line-height:1;margin-bottom:8px" id="previewImg">🥔</div>
            <div style="font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink)" id="previewName">Select a product</div>
            <div style="font-size:11.5px;color:var(--ink-3);margin-top:3px" id="previewCat">—</div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)">
              <div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)" id="previewPrice">— ETB</div>
              <div style="font-size:11px;color:var(--ink-3);margin-top:2px" id="previewEq">per unit</div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  `;

  /* ── EVENT LISTENERS ── */
  document.querySelectorAll('.unit-picker .up-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      unit = tab.dataset.unit;
      refreshUnitUI();
    });
  });

  document.getElementById('priceInput')?.addEventListener('input', renderPricePreview);
  document.getElementById('estWeightInput')?.addEventListener('input', renderPricePreview);

  // Product Picker logic (simplified for this example)
  const searchInput = document.getElementById('prodSearchInput');
  const prodResults = document.getElementById('productResults');
  
  searchInput?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    if (!q) { prodResults.innerHTML = ''; return; }
    
    const matches = catalog.filter(p => p.name.toLowerCase().includes(q));
    prodResults.innerHTML = matches.map(p => `
      <button type="button" class="product-result-item" data-slug="${p.slug}">
        <span class="product-result-thumb">${p.image}</span>
        <span class="product-result-copy"><strong>${p.name}</strong><small>${p.category}</small></span>
      </button>
    `).join('');

    prodResults.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const prod = catalog.find(p => p.slug === btn.dataset.slug);
        document.getElementById('previewImg').textContent = prod.image;
        document.getElementById('previewName').textContent = prod.name;
        document.getElementById('previewCat').textContent = prod.category;
        searchInput.value = prod.name;
        prodResults.innerHTML = '';
      });
    });
  });

  /* INIT */
  refreshUnitUI();
</script>
</body>
</html>
