<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analytics · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'analytics' });

  /* ── Demo data (later: GET /api/sellers/me/analytics?period=7d) ── */
  const kpis = {
    revenue:    { value: 145000, unit: 'ETB', delta: 22, label: 'Revenue · last 7 days' },
    orders:     { value: 42,                delta: 15, label: 'Orders received' },
    views:      { value: 1246,              delta: 18, label: 'Offer views' },
    conversion: { value: 3.4, unit: '%',    delta: 0.6, label: 'View → order rate' },
  };

  /* Daily bars — 7 days */
  const bars = [
    { day: 'Mon', value: 18 },
    { day: 'Tue', value: 24 },
    { day: 'Wed', value: 16 },
    { day: 'Thu', value: 32 },
    { day: 'Fri', value: 28 },
    { day: 'Sat', value: 41 },
    { day: 'Sun', value: 35, today: true },
  ];
  const maxBar = Math.max(...bars.map(b => b.value));

  /* Rings */
  const rings = [
    { value: 98,  label: 'Fulfillment',   tone: '' },
    { value: 72,  label: 'Monthly goal',  tone: 'gold' },
    { value: 94,  label: 'Response rate', tone: 'blue' },
  ];

  /* Top products */
  const topProducts = [
    { name: 'Red Potatoes 2kg',  img: '🥔', sold: 45, revenue: 382500, trend: 12 },
    { name: 'Red Onions 1kg',    img: '🧅', sold: 28, revenue: 154000, trend: 8 },
    { name: 'Tomatoes 1kg',      img: '🍅', sold: 33, revenue: 204600, trend: -3 },
    { name: 'Fresh Carrots 1kg', img: '🥕', sold: 12, revenue: 48000,  trend: 4 },
    { name: 'Green Peppers 1kg', img: '🫑', sold: 18, revenue: 140400, trend: 6 },
  ];

  /* Top buyers */
  const topBuyers = [
    { name: 'Sara Bekele',      initials: 'SB', orders: 12, spent: 98000 },
    { name: 'Merkato Fresh Co.', initials: 'MF', orders: 8,  spent: 156000 },
    { name: 'Abebe Tesfaye',    initials: 'AT', orders: 6,  spent: 42000 },
    { name: 'Hanna Girma',      initials: 'HG', orders: 5,  spent: 61000 },
  ];

  /* Heatmap — orders per day (35 cells = 5 weeks × 7 days) */
  const heat = Array.from({ length: 35 }, () => Math.floor(Math.random() * 5));

  /* Traffic sources */
  const sources = [
    { name: 'Direct search',    pct: 42, color: 'var(--brand)' },
    { name: 'WhatsApp shares',  pct: 26, color: 'var(--gold-dark)' },
    { name: 'Storefront link',  pct: 18, color: 'var(--blue)' },
    { name: 'Other',            pct: 14, color: 'var(--ink-4)' },
  ];

  const fmtNum = (n) => n.toLocaleString('en-ET');

  page.innerHTML = `
    <div class="page-top">

      <div class="ph">
        <div>
          <h1 class="welcome-line">Analytics</h1>
          <p>How your store is performing · <strong style="color:var(--brand)">Sep 27 – Oct 3, 2025</strong></p>
        </div>
        <div class="actions">
          <div class="period-tabs" role="group" aria-label="Time range">
            <button data-period="7d">7 days</button>
            <button data-period="30d">30 days</button>
            <button data-period="90d" class="active">90 days</button>
            <button data-period="all">All time</button>
          </div>
          <button class="btn btn-ghost">⬇ Export PDF</button>
        </div>
      </div>

    </div>

    <div class="page-body">

      <div class="orders-list">

        <!-- ═══ KPI ROW ═══ -->
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-lbl">💰 Revenue</div>
            <div class="kpi-val">${fmtNum(kpis.revenue.value)}<small>${kpis.revenue.unit}</small></div>
            <div class="kpi-foot">
              <span class="kpi-delta up">▲ ${kpis.revenue.delta}%</span>
              <span>${kpis.revenue.label}</span>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-lbl">🧾 Orders</div>
            <div class="kpi-val">${kpis.orders.value}</div>
            <div class="kpi-foot">
              <span class="kpi-delta up">▲ ${kpis.orders.delta}%</span>
              <span>${kpis.orders.label}</span>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-lbl">👁️ Views</div>
            <div class="kpi-val">${fmtNum(kpis.views.value)}</div>
            <div class="kpi-foot">
              <span class="kpi-delta up">▲ ${kpis.views.delta}%</span>
              <span>${kpis.views.label}</span>
            </div>
          </div>
          <div class="kpi">
            <div class="kpi-lbl">🎯 Conversion</div>
            <div class="kpi-val">${kpis.conversion.value}<small>${kpis.conversion.unit}</small></div>
            <div class="kpi-foot">
              <span class="kpi-delta up">▲ ${kpis.conversion.delta}%</span>
              <span>${kpis.conversion.label}</span>
            </div>
          </div>
        </div>

        <!-- ═══ SALES CHART ═══ -->
        <div class="chart-card">
          <div class="cc-head">
            <div>
              <h3>Daily orders this week</h3>
              <div class="sub">Weekend orders dominate — think about stock for Fri–Sun</div>
            </div>
            <div class="cc-legend">
              <span><span class="dot"></span> Past days</span>
              <span><span class="dot gold"></span> Today</span>
            </div>
          </div>

          <div class="bar-chart">
            ${bars.map(b => `
              <div class="bar-col ${b.today ? 'today' : ''}">
                <div class="bar" style="height:${(b.value / maxBar) * 100}%">
                  <span class="bar-val">${b.value}</span>
                </div>
                <div class="bar-lbl">${b.day}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- ═══ RINGS ROW ═══ -->
        <div class="chart-card">
          <div class="cc-head">
            <h3>Performance rings</h3>
            <div class="sub">Fulfillment · goal · responsiveness</div>
          </div>
          <div class="ring-row">
            ${rings.map((r, i) => {
              const c = 2 * Math.PI * 40;
              const off = c - (r.value / 100) * c;
              return `
                <div class="ring-item ${r.tone}">
                  <svg viewBox="0 0 96 96">
                    <circle cx="48" cy="48" r="40" fill="none" stroke-width="8" class="ring-track"/>
                    <circle cx="48" cy="48" r="40" fill="none" stroke-width="8" class="ring-value"
                      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
                  </svg>
                  <div class="ring-text">${r.value}%</div>
                  <div class="ring-lbl">${r.label}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- ═══ TWO COLUMN: Top products + Top buyers ═══ -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px"
             class="analytics-2col">

          <!-- Top products -->
          <div class="chart-card" style="margin:0">
            <div class="cc-head">
              <h3>Top products</h3>
              <div class="sub">By revenue, last 90 days</div>
            </div>
            <div class="top-list">
              ${topProducts.map((p, i) => `
                <div class="top-row">
                  <div class="rank">${i + 1}</div>
                  <div class="tico">${p.img}</div>
                  <div class="tbody">
                    <strong>${p.name}</strong>
                    <small>${p.sold} qtl sold · ${p.trend > 0 ? '▲' : '▼'} ${Math.abs(p.trend)}%</small>
                  </div>
                  <div class="tval">
                    ${fmtNum(p.revenue)}
                    <small>ETB</small>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Top buyers -->
          <div class="chart-card" style="margin:0">
            <div class="cc-head">
              <h3>Top buyers</h3>
              <div class="sub">Your most loyal customers</div>
            </div>
            <div class="top-list">
              ${topBuyers.map((b, i) => `
                <div class="top-row">
                  <div class="rank">${i + 1}</div>
                  <div class="tico" style="background:var(--gold-tint);color:var(--gold-dark);font-weight:700;font-size:13px">
                    ${b.initials}
                  </div>
                  <div class="tbody">
                    <strong>${b.name}</strong>
                    <small>${b.orders} orders completed</small>
                  </div>
                  <div class="tval">
                    ${fmtNum(b.spent)}
                    <small>ETB</small>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- ═══ TRAFFIC SOURCES ═══ -->
        <div class="chart-card">
          <div class="cc-head">
            <h3>Where buyers come from</h3>
            <div class="sub">Traffic sources · last 90 days</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            ${sources.map(s => `
              <div>
                <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">
                  <span style="color:var(--ink-2);font-weight:500">${s.name}</span>
                  <strong style="color:var(--brand);font-family:var(--serif)">${s.pct}%</strong>
                </div>
                <div class="progress" style="background:var(--bg-2)">
                  <span style="width:${s.pct}%;background:${s.color}"></span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- ═══ HEATMAP ═══ -->
        <div class="chart-card">
          <div class="cc-head">
            <h3>Order activity heatmap</h3>
            <div class="sub">Last 5 weeks · darker = more orders</div>
          </div>
          <div class="heatmap">
            ${heat.map(lvl => `<div class="heat-cell" data-level="${lvl}" title="${lvl * 8} orders"></div>`).join('')}
          </div>
          <div class="heatmap-labels">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
        </div>

      </div>

      <!-- ═══ RIGHT RAIL ═══ -->
      <aside class="panel">

        <div class="mini">
          <div class="mini__head"><h3>Quick insights</h3></div>
          <div class="notif-list">
            <div class="notif-item">
              <div class="nico green">📈</div>
              <div class="nbody"><p>Revenue is up <strong>22%</strong> vs last week</p></div>
            </div>
            <div class="notif-item">
              <div class="nico gold">🔥</div>
              <div class="nbody"><p><strong>Weekends</strong> drive 40% of your orders</p></div>
            </div>
            <div class="notif-item">
              <div class="nico amber">⚠️</div>
              <div class="nbody"><p><strong>Tomatoes</strong> down 3% — consider a price drop</p></div>
            </div>
            <div class="notif-item">
              <div class="nico blue">💡</div>
              <div class="nbody"><p>Sellers with <strong>more photos</strong> convert 2× better</p></div>
            </div>
          </div>
        </div>

        <div class="mini">
          <div class="mini__head"><h3>Benchmarks</h3></div>
          <div class="row-item">
            <div class="ico gold">⚖️</div>
            <div class="body">
              <strong>You vs market</strong>
              <small>7% below average pricing</small>
            </div>
            <span class="val">+7%</span>
          </div>
          <div class="row-item">
            <div class="ico blue">⚡</div>
            <div class="body">
              <strong>Fulfillment</strong>
              <small>98% — top 10% of sellers</small>
            </div>
            <span class="val">A+</span>
          </div>
          <div class="row-item">
            <div class="ico green">⭐</div>
            <div class="body">
              <strong>Rating</strong>
              <small>4.7 · above market (4.3)</small>
            </div>
            <span class="val">▲</span>
          </div>
        </div>

        <div class="mini">
          <div class="mini__head"><h3>Export reports</h3></div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">📄 Sales report (PDF)</button>
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">📊 Order data (CSV)</button>
            <button class="btn btn-soft btn-block" style="justify-content:flex-start">💰 Tax statement</button>
          </div>
        </div>

      </aside>

    </div>

    <div class="foot-bar" style="margin-top:22px">
      <div class="helper">
        <div class="dot-btn"><span class="dot"></span> Data updates live</div>
        <div class="dot-btn"><span class="dot" style="background:var(--gold)"></span> Last synced 2 minutes ago</div>
      </div>
      <span class="muted" style="font-size:12px">Sep 27 – Oct 3, 2025</span>
    </div>

    <style>
      @media (max-width: 900px) {
        .analytics-2col { grid-template-columns: 1fr !important; }
      }
    </style>
  `;

  /* Period tab switching (visual for now) */
  page.querySelectorAll('.period-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      page.querySelectorAll('.period-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      /* Later: re-fetch /api/sellers/me/analytics?period=X and re-render */
    });
  });
</script>
</body>
</html>
