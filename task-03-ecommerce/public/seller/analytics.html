<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analytics · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'analytics' });

  // ZERO STATE: All charts and metrics empty
  const bars = [0, 0, 0, 0, 0, 0, 0];
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  
  page.innerHTML = `
    <div class="page-top">
      <div class="ph">
        <div>
          <h1 class="welcome-line">Analytics</h1>
          <p>How your store is performing · <strong style="color:var(--brand)">Sep 27 – Oct 3, 2025</strong></p>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="orders-list">
        <!-- KPI ROW (Zeroed) -->
        <div class="kpi-row">
          <div class="kpi">
            <div class="kpi-lbl">💰 Revenue</div>
            <div class="kpi-val">0<small>ETB</small></div>
            <div class="kpi-foot"><span>No sales yet</span></div>
          </div>
          <div class="kpi">
            <div class="kpi-lbl">🧾 Orders</div>
            <div class="kpi-val">0</div>
            <div class="kpi-foot"><span>No orders yet</span></div>
          </div>
          <div class="kpi">
            <div class="kpi-lbl">👁️ Views</div>
            <div class="kpi-val">0</div>
            <div class="kpi-foot"><span>Share store to get views</span></div>
          </div>
          <div class="kpi">
            <div class="kpi-lbl">🎯 Conversion</div>
            <div class="kpi-val">—<small>%</small></div>
            <div class="kpi-foot"><span>Not enough data</span></div>
          </div>
        </div>

        <!-- SALES CHART (Flatlined) -->
        <div class="chart-card">
          <div class="cc-head">
            <div><h3>Daily orders this week</h3><div class="sub">Your sales will appear here</div></div>
          </div>
          <div class="bar-chart" style="align-items: flex-end; height: 200px;">
            ${bars.map((b, i) => `
              <div class="bar-col">
                <div class="bar" style="height: 4px; background: var(--border);"></div>
                <div class="bar-lbl">${days[i]}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- TOP PRODUCTS & BUYERS (Empty) -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px" class="analytics-2col">
          <div class="chart-card" style="margin:0">
            <div class="cc-head"><h3>Top products</h3></div>
            <div class="empty-mini" style="padding: 40px 0;">
              <div class="big">📦</div>
              <p>No product data yet.</p>
            </div>
          </div>
          <div class="chart-card" style="margin:0">
            <div class="cc-head"><h3>Top buyers</h3></div>
            <div class="empty-mini" style="padding: 40px 0;">
              <div class="big">👤</div>
              <p>No customer data yet.</p>
            </div>
          </div>
        </div>
      </div>

      <aside class="panel">
        <div class="mini">
          <div class="mini__head"><h3>Quick insights</h3></div>
          <div class="notif-list">
            <div class="notif-item">
              <div class="nico blue">💡</div>
              <div class="nbody"><p>Sellers with <strong>more photos</strong> convert 2× better</p></div>
            </div>
            <div class="notif-item">
              <div class="nico gold">🔥</div>
              <div class="nbody"><p><strong>Weekends</strong> drive 40% of all orders</p></div>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <style>@media (max-width: 900px) { .analytics-2col { grid-template-columns: 1fr !important; } }</style>
  `;
</script>
</body>
</html>
