<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings · Etfruit Seller</title>
  <link rel="stylesheet" href="/css/seller.css" />
</head>
<body>
<script type="module">
  import { renderShell, guardSeller } from '/js/seller/shell.js';

  const seller = guardSeller();
  const page = renderShell({ active: 'settings' });

  // 1. DYNAMIC DATA: Pull real info from the registered account
  // We use fallbacks (|| '—') in case a field is empty
  const profile = {
    name: seller.user?.name || 'Merchant Name',
    phone: seller.phone || '—',
    email: seller.user?.email || '—',
    faydaId: seller.faydaId || '—',
    businessName: seller.businessName || 'My Business',
    businessType: seller.businessType || 'farm',
    city: seller.city || 'Ethiopia',
    tin: seller.tin || '—',
    bio: seller.bio || 'No description provided yet.',
    bankName: seller.bank?.name || 'Not linked',
    account: seller.bank?.accountNumber ? '•••• ' + seller.bank.accountNumber.slice(-4) : '—',
    holderName: seller.bank?.holderName || '—',
    scale: seller.scale || 'wholesale',
    scaleLabel: seller.scale === 'retail' ? '🌾 Kilo Seller' : seller.scale === 'bulk' ? '🏭 Ton Seller' : '📦 Quintal Seller',
    verified: seller.verificationStatus === 'verified',
    memberSince: new Date(seller.createdAt || Date.now()).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
  };

  page.innerHTML = `
    <div class="page-top">
      <div class="ph">
        <div>
          <h1 class="welcome-line">Settings</h1>
          <p>Manage your profile, business details and preferences</p>
        </div>
        <div class="actions">
          <a class="btn btn-ghost" href="/seller/storefront.html">👁️ View storefront</a>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="orders-list">

        <!-- Settings tabs (RESTORED ALL 5) -->
        <div class="settings-tabs">
          <button class="stab active" data-tab="profile">👤 Profile</button>
          <button class="stab" data-tab="business">🏢 Business</button>
          <button class="stab" data-tab="bank">💳 Bank</button>
          <button class="stab" data-tab="notifications">🔔 Notifications</button>
          <button class="stab" data-tab="security">🔒 Security</button>
        </div>

        <!-- Profile tab -->
        <div class="settings-panel active" data-panel="profile">
          <div class="form-card">
            <div class="form-section">
              <h3>Personal information</h3>
              <p class="sec-sub">Your identity is verified by Etfruit and can't be changed without re-verification.</p>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Full name</div>
                  <div class="desc">As it appears on your Fayda ID</div>
                </div>
                <div class="main-fields">
                  <input class="input" value="${profile.name}" />
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Phone number</div>
                  <div class="desc">We'll text order alerts here</div>
                </div>
                <div class="main-fields">
                  <input class="input" value="${profile.phone}" />
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Email</div>
                  <div class="desc">For receipts and payout notices</div>
                </div>
                <div class="main-fields">
                  <input class="input" type="email" value="${profile.email}" />
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Fayda ID</div>
                  <div class="desc">🔒 Locked — verified</div>
                </div>
                <div class="main-fields">
                  <div style="display:flex;align-items:center;gap:10px">
                    <input class="input" value="${profile.faydaId}" readonly style="background:var(--bg-2);color:var(--ink-3)" />
                    ${profile.verified ? '<span class="pill active">✓ Verified</span>' : '<span class="pill pending">⏳ Pending</span>'}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Business tab -->
        <div class="settings-panel" data-panel="business">
          <div class="form-card">
            <div class="form-section">
              <h3>Business details</h3>
              <p class="sec-sub">These appear on your public storefront and to buyers.</p>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Business name</div>
                  <div class="desc">Shown on every offer and order</div>
                </div>
                <div class="main-fields">
                  <input class="input" value="${profile.businessName}" />
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Business type</div>
                  <div class="desc">Farm, wholesaler, retailer…</div>
                </div>
                <div class="main-fields">
                  <select class="input">
                    <option value="farm" ${profile.businessType==='farm'?'selected':''}>Farm</option>
                    <option value="wholesaler" ${profile.businessType==='wholesaler'?'selected':''}>Wholesaler</option>
                    <option value="retailer" ${profile.businessType==='retailer'?'selected':''}>Retailer</option>
                    <option value="distributor" ${profile.businessType==='distributor'?'selected':''}>Distributor</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Location</div>
                  <div class="desc">City and region</div>
                </div>
                <div class="main-fields">
                  <input class="input" value="${profile.city}" />
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">TIN</div>
                  <div class="desc">🔒 Locked — verified with Ministry of Revenues</div>
                </div>
                <div class="main-fields">
                  <div style="display:flex;align-items:center;gap:10px">
                    <input class="input" value="${profile.tin}" readonly style="background:var(--bg-2);color:var(--ink-3)" />
                    ${profile.verified ? '<span class="pill active">✓ Verified</span>' : '<span class="pill pending">⏳ Pending</span>'}
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Store description</div>
                  <div class="desc">Short bio for your storefront</div>
                </div>
                <div class="main-fields">
                  <textarea class="input" rows="3">${profile.bio}</textarea>
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Selling scale</div>
                  <div class="desc">🔒 Contact support to change</div>
                </div>
                <div class="main-fields">
                  <div style="display:flex;align-items:center;gap:10px">
                    <span class="scale-badge ${profile.scale} lg">${profile.scaleLabel}</span>
                    <span class="pill paused">Locked</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bank tab -->
        <div class="settings-panel" data-panel="bank">
          <div class="form-card">
            <div class="form-section">
              <h3>Payout account</h3>
              <p class="sec-sub">Where Chapa sends your earnings. Changes require verification.</p>

              <div class="bank-card" style="margin-bottom:22px">
                <div class="bank-logo">🏦</div>
                <div class="info">
                  <strong>${profile.bankName}</strong>
                  <div class="acct">${profile.account}</div>
                  <div class="holder">${profile.holderName}</div>
                </div>
                <div class="badges">
                  ${profile.verified ? '<span class="pill active">✓ Active</span>' : '<span class="pill pending">⏳ Pending</span>'}
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Bank name</div>
                  <div class="desc">Where we deposit earnings</div>
                </div>
                <div class="main-fields">
                  <select class="input">
                    <option selected>Commercial Bank of Ethiopia</option>
                    <option>Awash Bank</option>
                    <option>Dashen Bank</option>
                    <option>Bank of Abyssinia</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Account holder</div>
                  <div class="desc">Must match the business name</div>
                </div>
                <div class="main-fields">
                  <input class="input" value="${profile.holderName}" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Notifications tab -->
        <div class="settings-panel" data-panel="notifications">
          <div class="form-card">
            <div class="form-section">
              <h3>Notification preferences</h3>
              <p class="sec-sub">Choose what you want to be notified about.</p>

              <div class="toggle-row">
                <div class="tinfo">
                  <strong>📱 SMS — New orders</strong>
                  <small>Get a text whenever a buyer places an order</small>
                </div>
                <button class="toggle-switch on" data-toggle></button>
              </div>
              <div class="toggle-row">
                <div class="tinfo">
                  <strong>📧 Email — Daily summary</strong>
                  <small>A morning digest of orders and revenue</small>
                </div>
                <button class="toggle-switch on" data-toggle></button>
              </div>
              <div class="toggle-row">
                <div class="tinfo">
                  <strong>💰 Email — Payout sent</strong>
                  <small>Confirmation each time Chapa deposits money</small>
                </div>
                <button class="toggle-switch on" data-toggle></button>
              </div>
            </div>
          </div>
        </div>

        <!-- Security tab -->
        <div class="settings-panel" data-panel="security">
          <div class="form-card">
            <div class="form-section">
              <h3>Password & security</h3>
              <p class="sec-sub">Keep your seller account safe.</p>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">Current password</div>
                  <div class="desc">Required to make changes</div>
                </div>
                <div class="main-fields">
                  <input class="input" type="password" placeholder="••••••••" />
                </div>
              </div>

              <div class="form-row">
                <div class="side">
                  <div class="ttl">New password</div>
                  <div class="desc">At least 8 characters</div>
                </div>
                <div class="main-fields">
                  <input class="input" type="password" placeholder="••••••••" />
                  <input class="input" type="password" placeholder="Confirm new password" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Save bar -->
        <div class="save-bar">
          <div class="info">Changes are saved to your account instantly. <strong>Some fields require re-verification.</strong></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost">Cancel</button>
            <button class="btn btn-gold">Save changes</button>
          </div>
        </div>

      </div>

      <aside class="panel">
        <div class="mini">
          <div class="mini__head"><h3>Account status</h3></div>
          <div class="row-item">
            <div class="ico ${profile.verified ? 'green' : 'amber'}">${profile.verified ? '✓' : '⏳'}</div>
            <div class="body">
              <strong>${profile.verified ? 'Verified seller' : 'Under review'}</strong>
              <small>Since ${profile.memberSince}</small>
            </div>
          </div>
          <div class="row-item">
            <div class="ico gold">📦</div>
            <div class="body">
              <strong>${profile.scaleLabel}</strong>
              <small>Locked selling scale</small>
            </div>
          </div>
        </div>
      </aside>
    </div>
  `;

  // Tab Switching Logic
  page.querySelectorAll('.stab').forEach(tab => {
    tab.addEventListener('click', () => {
      page.querySelectorAll('.stab').forEach(t => t.classList.remove('active'));
      page.querySelectorAll('.settings-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      page.querySelector(`.settings-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
    });
  });

  // Toggle Switches Logic
  page.querySelectorAll('.toggle-switch').forEach(t => {
    t.addEventListener('click', () => t.classList.toggle('on'));
  });
</script>
</body>
</html>
