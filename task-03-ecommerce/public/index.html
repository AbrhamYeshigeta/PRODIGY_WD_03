<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Prodigy Store</title>
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <a href="/" class="auth-brand">
        <span class="auth-logo">P</span>
        <span class="auth-brand-name">Prodigy Store</span>
      </a>

      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue shopping</p>

      <form id="login-form">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Your password" />
        </div>
        <button type="submit" class="btn btn-green btn-full">Sign in</button>
      </form>

      <p id="msg" class="msg"></p>

      <p class="auth-footer">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </div>
  </main>
  <script type="module" src="/js/auth/login.js"></script>
</body>
</html>
